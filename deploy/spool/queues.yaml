# Queue definitions. This file is the security policy and the cost policy: it
# holds the prompts, the tool restrictions, and the budget caps, so it belongs in
# git and is reviewed as a diff. The API exposes it read-only (design §3.3).
#
# Names here are the real ones the spike captured from CLI 2.1.282, not the
# design doc's placeholders:
#   - the Notion connector is "claude.ai Notion", contributing tools prefixed
#     mcp__claude_ai_Notion__
#   - claude.ai-synced skills are namespaced, e.g. anthropic-skills:notion-media
#
# Three tool lists, which are easy to confuse:
#   tools:             the built-in tools the run may use AT ALL (--tools).
#   allowed_tools:     pre-approval so a needed tool is not denied for want of a
#                      human (--allowedTools). It does NOT restrict.
#   disallowed_tools:  denied outright, and wins over allowed_tools. This is the
#                      only way to restrict MCP tools, which --tools cannot.
# Omitting `tools` leaves every built-in available — including Bash for commands
# the CLI deems safe. Always set it for an unattended queue.
#
# On the connector wildcards below: this is cost control, measured rather than
# assumed. Two identical jobs on this account, CLI 2.1.282, sonnet:
#
#   all connectors enabled:  202 MCP tools offered, 222,167 tokens of context
#                            created on the first turn, $1.03 for one job
#   only Notion kept:         29 MCP tools offered,  73,118 tokens, $0.43
#
# So denying the connectors a queue does not declare in `requires` cut the cost
# by about 2.4x. The remainder is the skill's own content plus the Notion
# schemas, which the job actually needs. Revisit this list whenever you enable or
# disable a connector on claude.ai — a newly enabled one is offered by default
# and silently costs every queue.

queues:
  media:
    description: Add or update entries in the Notion Media database
    prompt: |
      /anthropic-skills:notion-media {{input}}
    system_prompt: |
      Prefer the edition/format details given. If the user says they own it, also record a Copy.
    requires:
      skills: [notion-media]
      connectors: [notion]
    tools: [Skill, WebSearch, WebFetch]
    allowed_tools:
      - Skill
      - WebSearch
      - WebFetch
      - mcp__claude_ai_Notion__notion-search
      - mcp__claude_ai_Notion__notion-fetch
      - mcp__claude_ai_Notion__notion-query-data-sources
      - mcp__claude_ai_Notion__notion-create-pages
      - mcp__claude_ai_Notion__notion-update-page
    disallowed_tools:
      # Adding a media entry has no business restructuring the workspace.
      - mcp__claude_ai_Notion__notion-move-pages
      - mcp__claude_ai_Notion__notion-duplicate-page
      - mcp__claude_ai_Notion__notion-create-database
      - mcp__claude_ai_Notion__notion-update-data-source
      - mcp__claude_ai_Notion__notion-spawn-session
      # Connectors this queue does not need — see the cost note above.
      - mcp__claude_ai_Adobe_for_creativity__*
      - mcp__claude_ai_Todoist__*
      - mcp__claude_ai_Claude_Docs__*
    args:
      url:
        type: string
        format: uri
        description: A link the entry came from, when the share sheet has one.
    outcome_extension:
      notion_url:
        type: string
        description: The page created or updated.
      media_type:
        enum: [book, film, tv, game, album, podcast, comic, essay, ttrpg]
    model: sonnet
    max_turns: 30
    # A guard, not a target: a correctly configured run of this queue costs cents.
    max_budget_usd: 0.50
    timeout: 10m
    weight: 1
    notify: [job.failed, job.needs_input]
    retention: 180d

  ideas:
    description: Capture an idea in the Notion Ideas database
    prompt: |
      /anthropic-skills:notion-ideas {{input}}
    system_prompt: |
      Every job is an explicit request to save an idea, even if it is phrased as a
      bare description. Include any link given.
    requires:
      skills: [notion-ideas]
      connectors: [notion]
    tools: [Skill, WebSearch, WebFetch]
    allowed_tools:
      - Skill
      - WebSearch
      - WebFetch
      - mcp__claude_ai_Notion__notion-search
      - mcp__claude_ai_Notion__notion-fetch
      - mcp__claude_ai_Notion__notion-query-data-sources
      - mcp__claude_ai_Notion__notion-create-pages
    disallowed_tools:
      # The skill only ever adds a page; capturing an idea has no business
      # editing existing ones, let alone restructuring the workspace.
      - mcp__claude_ai_Notion__notion-update-page
      - mcp__claude_ai_Notion__notion-move-pages
      - mcp__claude_ai_Notion__notion-duplicate-page
      - mcp__claude_ai_Notion__notion-create-database
      - mcp__claude_ai_Notion__notion-update-data-source
      - mcp__claude_ai_Notion__notion-spawn-session
      # Connectors this queue does not need — see the cost note above.
      - mcp__claude_ai_Adobe_for_creativity__*
      - mcp__claude_ai_Todoist__*
      - mcp__claude_ai_Claude_Docs__*
    args:
      url:
        type: string
        format: uri
        description: A link the idea came from, when the share sheet has one.
    outcome_extension:
      notion_url:
        type: string
        description: The page created.
      idea_type:
        enum: [Tool, Project idea, Gear, Technique, Inspiration, Reading, Model, Jig, Language, Social]
    model: sonnet
    max_turns: 30
    # A guard, not a target: a correctly configured run of this queue costs cents.
    max_budget_usd: 0.50
    timeout: 10m
    weight: 1
    notify: [job.failed, job.needs_input]
    retention: 180d

  places:
    description: Add a place, or log a visit, in the Notion Places database
    prompt: |
      /anthropic-skills:notion-places {{input}}
    # The skill was written for the claude.ai app, and three of its assumptions
    # do not hold unattended: it has no idea where "the user's own area" is, its
    # places_search tool is a claude.ai app tool the CLI does not offer, and it
    # asks before updating an existing entry, which would turn every repeat
    # visit into a needs_input.
    system_prompt: |
      I live in Chicago. When no city or neighbourhood is given, assume Chicago.

      If places_search is not available, find the place's name, address and a
      Google Maps link with WebSearch and WebFetch instead. Set whatever Location
      fields you can confirm and leave the rest blank rather than guessing.

      If the place is already in the database and the message logs a visit,
      update that page instead of asking: set Last visited, increment Visit
      count, and add anyone newly named to Have been. If it is already there and
      the message adds nothing new, change nothing and link the existing page.

      Write the page body only from what the message says. Do not add details
      it does not give, such as which meal or occasion it was; the skill's
      examples are illustrations, not facts about this visit.
    requires:
      skills: [notion-places]
      connectors: [notion]
    tools: [Skill, WebSearch, WebFetch]
    allowed_tools:
      - Skill
      - WebSearch
      - WebFetch
      - mcp__claude_ai_Notion__notion-search
      - mcp__claude_ai_Notion__notion-fetch
      - mcp__claude_ai_Notion__notion-query-data-sources
      - mcp__claude_ai_Notion__notion-create-pages
      - mcp__claude_ai_Notion__notion-update-page
    disallowed_tools:
      # Logging a place has no business restructuring the workspace.
      - mcp__claude_ai_Notion__notion-move-pages
      - mcp__claude_ai_Notion__notion-duplicate-page
      - mcp__claude_ai_Notion__notion-create-database
      - mcp__claude_ai_Notion__notion-update-data-source
      - mcp__claude_ai_Notion__notion-spawn-session
      # Connectors this queue does not need — see the cost note above.
      - mcp__claude_ai_Adobe_for_creativity__*
      - mcp__claude_ai_Todoist__*
      - mcp__claude_ai_Claude_Docs__*
    args:
      url:
        type: string
        format: uri
        description: A link to the place, e.g. a Google Maps share.
    outcome_extension:
      notion_url:
        type: string
        description: The page created or updated.
      action:
        enum: [created, updated, unchanged]
    model: sonnet
    max_turns: 30
    # A guard, not a target: a correctly configured run of this queue costs cents.
    max_budget_usd: 0.50
    timeout: 10m
    weight: 1
    notify: [job.failed, job.needs_input]
    retention: 180d
