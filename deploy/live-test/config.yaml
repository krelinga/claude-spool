# Config for live tests: real queues against a real claude.ai login, in a
# throwaway container. The token comes from the environment, so this file is
# safe to keep in git.

listen: ":8080"
data_dir: /data

claude:
  binary: claude
  config_dir: /data/claude
  credential_mode: claudeai_login
  default_model: sonnet
  # What one job may spend when its queue sets no max_budget_usd. Defaults to
  # 1.00; SPOOL_MAX_BUDGET_USD overrides it without editing this file.
  default_max_budget_usd: 1.00
  # A test container is up for an hour, not for days; nothing to keep warm.
  keepalive_interval: 0s
  login_attempt_ttl: 10m

# Reachable from the host, which is what the login URL in a notification uses.
public_url: "http://localhost:8081"

tokens:
  - name: admin
    token_env: SPOOL_TOKEN
    queues: ["*"]

# No webhook receivers: tests are driven by hand, so state is read from /v1/jobs
# rather than pushed anywhere.
