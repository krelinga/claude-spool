# Release each component independently. release-please keeps one release PR
# open per component; merging it tags `<component>/vX.Y.Z` and creates the
# GitHub Release. Publishing happens here rather than in a tag-triggered
# workflow because tags pushed with GITHUB_TOKEN do not trigger other workflows.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      backend-released: ${{ steps.rp.outputs['backend--release_created'] }}
      backend-version: ${{ steps.rp.outputs['backend--version'] }}
      backend-tag: ${{ steps.rp.outputs['backend--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  backend-image:
    needs: release-please
    if: needs.release-please.outputs.backend-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.backend-tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # One image per component, under the repo: .../claude-spool/<component>.
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.backend-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.backend-version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: backend
          # amd64 only for now: an emulated arm64 build is slow, and nothing
          # needs it yet. Add linux/arm64 here, and docker/setup-qemu-action
          # above, when something does.
          platforms: linux/amd64
          # No build-args: the Claude Code CLI version is pinned in the Dockerfile.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
